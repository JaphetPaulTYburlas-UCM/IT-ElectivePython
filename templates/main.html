{% extends 'base.html' %}
{% block logout %}
 <a href="/logout" class ="w3-bar-item w3-right w3-btn">LOG-OUT</a>
{% endblock %}
{% block content %}
    <table class = "w3-table-all w3-card4">
        <tr>
            <th>ID</th>
            <th>IDNO</th>
            <th>LASTNAME</th>
            <th>FIRSTNAME</th>
            <th>COURSE</th>
            <th>LEVEL</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>{{ student[4] }}</td>
            <td>{{ student[5] }}</td>
        </tr>
        {% endfor %}
    </table>

{% endblock %}
