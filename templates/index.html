{% extends 'base.html' %}
{% block content %}
    <form class="w3-mobile w3-card-4 w3-container w3-padding w3-round-xlarge w3-animate-top"
          style="width:40%;margin:auto" action="/userlogin" method="post">
        <p>
            <label for="email"><b>E-MAIL</b></label>
            <input type="email" name="email" id="email" class="w3-input w3-border">
        </p>
        <p>
            <label for="password"><b>PASSWORD</b></label>
            <input type="password" name="password" id="password" class="w3-input w3-border">
        </p>
        <p class="w3-right">
            <input type="submit" value="LOGIN" class="w3-button w3-blue">
        </p>
    </form>
{% endblock %}
